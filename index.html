<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSM Manga Reader</title>
    <meta
      name="description"
      content="Chainsaw Man colored manga reader. Browse by volume and read chapters in a vertical layout."
    />
    <link rel="icon" href="img/Favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="img/Favicon.png" />
    <meta name="theme-color" content="#111111" />
    <link rel="preload" as="image" href="img/volume00.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>CSM Colored Manga</h1>
      <p class="tagline">Select a volume to start reading</p>
    </header>
    <main class="container">
      <section
        class="volume-grid"
        id="volumeGrid"
        aria-label="Volumes"
      ></section>
    </main>
    <footer class="site-footer">
      <a
        href="https://github.com/thanzeelhassan/CSM-Coloured-Manga"
        target="_blank"
        rel="noopener"
        >Source</a
      >
    </footer>

    <script>
      (function () {
        const volumes = [
          { volume: 1, start: 1, end: 7 },
          { volume: 2, start: 8, end: 16 },
          { volume: 3, start: 17, end: 25 },
          { volume: 4, start: 26, end: 34 },
          { volume: 5, start: 35, end: 43 },
          { volume: 6, start: 44, end: 52 },
          { volume: 7, start: 53, end: 61 },
          { volume: 8, start: 62, end: 70 },
          { volume: 9, start: 71, end: 79 },
          { volume: 10, start: 80, end: 88 },
          { volume: 11, start: 89, end: 97 },
        ];

        const grid = document.getElementById("volumeGrid");
        volumes.forEach((v) => {
          const item = document.createElement("a");
          item.className = "volume-card";
          item.href = `volume.html?v=${v.volume}`;
          item.setAttribute(
            "aria-label",
            `Volume ${v.volume}: Chapters ${v.start} to ${v.end}`
          );

          const img = document.createElement("img");
          img.loading = "lazy";
          img.alt = `Volume ${v.volume}`;
          img.src = `Volumes/volume${v.volume}.jpg`;

          const caption = document.createElement("div");
          caption.className = "volume-caption";
          caption.textContent = `Volume ${v.volume} · Ch ${v.start}–${v.end}`;

          item.appendChild(img);
          item.appendChild(caption);
          grid.appendChild(item);
        });
      })();
    </script>
  </body>
</html>
